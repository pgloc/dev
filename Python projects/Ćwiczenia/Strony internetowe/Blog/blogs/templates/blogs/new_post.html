{% extends "blogs/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
  <h2>Dodaj nowy post:</h2>
{% endblock page_header %}

{% block content %}

  <form action="{% url 'blogs:new_post' %}" method="post" class="form">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn-lg btn-dark">Dodaj post</button>
  </form>

{% endblock content %}
