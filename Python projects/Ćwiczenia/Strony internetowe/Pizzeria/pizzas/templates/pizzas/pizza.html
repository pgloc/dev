{% extends 'pizzas/base.html' %}

{% block content %}

  <p>Pizza: {{ pizza }}</p>

  <p>Dodatki:</p>
  <ul>
  {% for topping in toppings %}
    <li>
      <p>{{ topping.date_added|date:'d M Y H:i' }}</p>
      <p>{{ topping.text|linebreaks }}</p>
    </li>
  {% empty %}
    <li>Nie ma jeszcze żadnego dodatku.</li>
  {% endfor %}
  </ul>

{% endblock content %}
