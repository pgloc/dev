{% extends "learning_logs/base.html" %}

{% block page_header %}
  <h2>Usuń temat</h2>
{% endblock page_header %}

{% block content %}
  <p>Czy na pewno chcesz usunąć ten temat i wszystkie powiązane z nim wpisy?</p>

  <h3><div>{{ topic }}</div></h3>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Usuń temat</button>
    <a href="{% url 'learning_logs:topic' topic.id %}" class="btn btn-secondary">Anuluj</a>
  </form>
  
{% endblock content %}
